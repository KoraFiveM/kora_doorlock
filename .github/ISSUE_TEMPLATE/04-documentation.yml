name: Documentation Issue
description: Report missing, outdated or unclear documentation for kora_doorlock.
title: '[Docs]: '
labels:
- documentation
- needs-triage
body:
- type: input
  id: page
  attributes:
    label: Documentation page or file
    placeholder: URL or path in kora_doorlock
  validations:
    required: true
- type: textarea
  id: issue
  attributes:
    label: What is wrong or missing?
    description: Name the area that needs clarification, such as Door configuration, Access rules and keys, Lockpicking, Automatic
      doors.
  validations:
    required: true
- type: textarea
  id: correction
  attributes:
    label: Suggested correction
